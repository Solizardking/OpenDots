        - region [ref=e562]:
          - generic [ref=e563]:
            - generic [ref=e564]: Research and actions
            - heading [level=2] [ref=e565]:
              - text: Prepare and launch a coin
              - link "Link to Prepare and launch a coin" [ref=e566] [cursor=pointer]:
                - /url: /docs#pump-launch
                - text: "#"
            - paragraph [ref=e567]: From an email request to an exact owner-approved transaction.
          - list [ref=e568]:
            - listitem [ref=e569]: Email an enabled CLAWD inbox with the coin name, symbol, description, and a PNG, JPEG, or WebP image up to 3 MiB, or a published HTTPS/IPFS metadata JSON URI. CLAWD asks for missing details and returns a review link.
            - listitem [ref=e570]: As the signed-in, approved owner of the receiving inbox, open Account → Launch on Pump.fun. Create the Privy launch wallet and fund its displayed address with SOL.
            - listitem [ref=e571]: Select the request and choose Review transaction. Inspect the mint, creator-fee wallet, simulated transaction, estimated costs, and 45-second expiry.
            - listitem [ref=e572]: Check the approval box and choose Approve and launch while the review is valid. An expired review needs a fresh review and approval.
            - listitem [ref=e573]: Use Refresh receipt for the saved signature. A confirmed coin link appears only after a successful confirmed transaction and live mint/bonding-curve account checks.
          - paragraph [ref=e574]: "You can also use Prepare a coin in the Account launch panel: choose an owned inbox, fill the fields, add an image or metadata URI, and select Prepare launch. Name is limited to 32 UTF-8 bytes, symbol to 13 UTF-8 bytes, description to 2,000 characters, and metadata URI to 200 characters. The prepared draft follows the same separate review and approval flow."
          - complementary [ref=e575]:
            - generic [ref=e579]:
              - heading "The launch wallet is server-managed" [level=3] [ref=e580]
              - paragraph [ref=e581]: This installation uses Privy with a server authorization key to manage the launch wallet. It is separate from an external wallet connected to the read-only live plugin. Email and MCP can prepare requests; only the signed-in, approved inbox owner can approve spending in CLAWD Mail.
          - paragraph [ref=e582]: The implementation creates a standard SOL-paired Token-2022 coin using the official Pump SDK create_v2 transaction. There is no initial buy, mayhem, cashback, or holder rewards. Total cost is capped at 0.05 SOL including rent and network costs. The creator-fee recipient is the launch wallet. Preparing image/description metadata publishes it through Pump.fun’s IPFS upload service.
          - paragraph [ref=e583]: Before broadcast, the reviewed message and signatures are verified and the signed wire and signature are saved. Concurrent approvals claim a request once. A network timeout stays submitted; refreshing checks that signature without creating another coin. A signing interruption requires receipt review.
          - heading "OpenDots and the launch MCP" [level=3] [ref=e584]
          - paragraph [ref=e585]: Choose an inbox in the launch panel, open Ask CLAWD from OpenDots, and generate a connection key. Copy the key once into an OpenDots connection named CLAWD Mail Launch using the displayed URL. It authorizes preparation/read access to that inbox only. Revoking connection keys or account/inbox access invalidates the connector.
          - generic [ref=e586]:
            - generic [ref=e587]:
              - generic [ref=e588]: Preparation-only MCP endpoint and tools
              - button "Copy Preparation-only MCP endpoint and tools" [ref=e589] [cursor=pointer]: Copy
            - generic "Preparation-only MCP endpoint and tools" [ref=e593]:
              - code [ref=e594]: "POST /api/launch-mcp Authorization: Bearer <inbox-scoped connection key> prepare_pump_launch get_pump_launch list_pump_launches"
          - paragraph [ref=e595]: The MCP prepare tool requires a published metadataUri. Use a stable UUID requestId for idempotent retries. The OpenDots connection review approves draft creation; the later CLAWD Mail transaction review approves the launch. No signing or approval tool is exposed through MCP.
