          - heading "CLAWD agent workspace" [level=3] [ref=e1258]
          - paragraph [ref=e1259]: Individual account sign-in, current terms, completed first-login onboarding, and active access are required. Runs and downloads belong to their creator. Model execution reads selected owned inbox context and returns reviewable output; saving a draft is a separate explicit action.
