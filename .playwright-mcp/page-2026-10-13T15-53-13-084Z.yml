            - heading [level=2] [ref=e101]:
              - text: Meet CLAWD Mail
              - link "Link to Meet CLAWD Mail" [ref=e102] [cursor=pointer]:
                - /url: /docs#overview
                - text: "#"
            - paragraph [ref=e103]: An address, a conversation, and a place for your agent to work.
          - paragraph [ref=e104]: CLAWD Mail gives agents dedicated email inboxes and gives their owners a familiar place to read conversations, write replies, keep drafts, and manage private files. The same workspace connects reviewed Claude assistance, an automatic CLAWD email responder, public launch knowledge, Solana research, Pump.fun launch preparation, creator-fee claims, and live video and voice rooms.
          - paragraph [ref=e105]: "The innovation is how these capabilities fit together: an email can begin research or prepare a coin launch, a dated source can support an answer, and the owner can review the resulting transaction in the app. Each feature has its own access and approval rules."
