              - heading "Feature availability" [level=3] [ref=e146]
              - paragraph [ref=e147]: This page describes the implemented application. AI, email delivery, launches, knowledge search, and media depend on the installation’s configured providers, credentials, credits, and running services. A configured feature or an accepted request does not prove delivery, a live broadcast, or an on-chain confirmation.
