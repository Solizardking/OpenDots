                - text: "#"
            - paragraph [ref=e525]: Observed market data and verified public-chain receipts.
          - paragraph [ref=e526]: The agent and live workspace expose public-wallet research, transaction checks, token details, launch observations, and provider market data. RPC reads verify Solana mainnet’s genesis hash. Receipts identify source, observation time, commitment, and slot when available. Provider quota and access failures remain explicit.
          - list [ref=e527]:
            - listitem [ref=e528]: Public-wallet research includes SOL, SPL Token, and Token-2022 holdings with a 100-token-account display cap.
            - listitem [ref=e529]: Token research verifies mint details, supply, decimals, and authorities. Transaction checks inspect status and parsed chain details.
            - listitem [ref=e530]: Helius is the default RPC through HELIUS_RPC_URL or server-side HELIUS_API_KEY, followed by the configured SOLANA_RPC_URL and SOLANA_BACKUP_RPC_URL fallbacks. Solana Tracker and optional Birdeye market data are separately labeled.
            - listitem [ref=e531]: Recent launches arrive through wss://clawd-ws.fly.dev/ws. Relay events are observations and can be missed during reconnection. Worker snapshots expire after ten minutes and are labeled stale after thirty seconds without refresh.
            - listitem [ref=e532]: The authenticated live page’s wallet plugin connects through Wallet Standard only after a click, or watches a pasted public address. It shares public accounts and performs read-only balance/history queries. It does not sign messages or transactions or broadcast funds.
