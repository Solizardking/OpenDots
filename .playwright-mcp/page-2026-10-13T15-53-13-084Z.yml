            - heading [level=2] [ref=e418]:
              - text: Your automatic CLAWD agent
              - link "Link to Your automatic CLAWD agent" [ref=e419] [cursor=pointer]:
                - /url: /docs#responder
                - text: "#"
            - paragraph [ref=e420]: An email-native agent that keeps working when the site is closed.
          - paragraph [ref=e421]: The CLAWD responder is a separate continuous worker using xAI grok-4.7 with a configured OpenRouter text fallback. In an enabled inbox belonging to an approved account, it can answer ordinary human messages, research the web, inspect public Solana data, use curated skills, understand supported images, prepare a launch request, and generate a requested image with xAI grok-imagine-image-2.0 or the separately configured OpenRouter image fallback. It sends its reply to the incoming message’s original author, preserving the thread.
          - list [ref=e422]:
            - listitem [ref=e423]: Open Account & files → Your CLAWD agent and choose an owned inbox.
            - listitem [ref=e424]: Inspect worker availability and recent reply jobs. Edit the agent name or character instructions, then save.
            - listitem [ref=e425]: Pause replies to stop new private processing and dispatch for that inbox; enable them when you want automatic responses.
            - listitem [ref=e426]: Email the enabled address. Once the worker sees eligible mail, it generates and sends a response without requiring the website to stay open.
          - complementary [ref=e427]:
            - generic [ref=e431]:
              - heading "Default enablement and historical mail" [level=3] [ref=e432]
              - paragraph [ref=e433]: Approved inboxes are enabled by default. MAIL_AGENT_BACKFILL=true also includes stored historical received mail for newly configured inboxes. Set it to false before first configuration to begin at configuration time. Existing inbox start times, pause decisions, and character settings are durable.
          - heading "Tools and context" [level=3] [ref=e434]
          - list [ref=e435]:
            - listitem [ref=e436]: "Curated skill IDs: solana-basics, wallet-research, transaction-check, token-research, image-generation, mail-agent, pump-launch, and clawd-and-musebook. Research tools provide bounded, read-only results; the launch tool prepares a draft for owner review."
            - listitem [ref=e437]: Up to four source-message PNG, JPEG, or WebP images can be interpreted, within a combined 5 MiB input budget. Other files and oversized images are omitted with an explanation.
            - listitem [ref=e438]: One requested image generation is allowed per message. Generated output must fit 3 MiB so the final email can remain within the provider’s 5 MiB message limit.
            - listitem [ref=e439]: Text context uses up to 100 non-Trash messages and 100,000 body characters plus 30,000 characters from the source message. Tool use is limited to four rounds and eight calls.
            - listitem [ref=e440]: Outgoing, self-addressed, automated, bulk/list, bounce, Trash, and invalid-source messages are excluded to prevent loops. A human message with List-ID alone can remain eligible. A Reply-To header cannot redirect the automatic reply.
          - 'region "Your automatic CLAWD agent: Job state, Meaning" [ref=e441]':
            - table [ref=e442]:
              - rowgroup [ref=e443]:
                - row [ref=e444]:
                  - columnheader "Job state" [ref=e445]
