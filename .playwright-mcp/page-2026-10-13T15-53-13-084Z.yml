                - text: "#"
            - paragraph [ref=e614]: Review accrued fees and collect into the same launch wallet.
          - paragraph [ref=e615]: Account → Claim creator fees reads wallet-wide creator vaults and retained curve/pool fees, including coins before and after PumpSwap migration. Claims collect into the same server-managed Privy launch wallet; the account identity chooses the wallet and recipient. The original single-creator SOL flow used by this launcher is supported; coins moved to fee sharing or holder rewards use their respective distribution flows.
          - list [ref=e616]:
            - listitem [ref=e617]: Load the balances for your launch wallet. Inspect the source and retained-fee amounts.
            - listitem [ref=e618]: Choose Review fee claim. The simulation shows gross fees, costs including rent, estimated net income, destination, and a 45-second expiry.
            - listitem [ref=e619]: Approve the exact claim using the checkbox and Approve and claim fees. Positive estimated net income and the 0.05 SOL total cost ceiling are required.
            - listitem [ref=e620]: Refresh the saved receipt. Large portfolios are batched to fit the 1,232-byte Solana transaction limit; review and approve remaining fees in another claim.
          - complementary [ref=e621]:
            - generic [ref=e625]:
              - heading "WSOL account effects" [level=3] [ref=e626]
              - paragraph [ref=e627]: PumpSwap payouts are unwrapped into SOL in the launch wallet. If the destination WSOL account already exists, the claim can also unwrap its existing balance and close that account, returning its rent. The review shows these amounts and the approval text includes those effects. A changed destination account requires a fresh review.
          - paragraph [ref=e628]: The database permits one active claim per owner and atomically fences signing across replicas. The signed transaction is saved before its single broadcast. A timeout remains submitted; receipt checks do not rebroadcast. Confirmation requires the successful on-chain transaction to match the reviewed message and saved signature. Expired, unconfirmed claims remain visibly unconfirmed.
