        - region [ref=e688]:
          - generic [ref=e689]:
            - generic [ref=e690]: Live rooms
            - heading [level=2] [ref=e691]:
              - text: CLAWD Solana Live
              - link "Link to CLAWD Solana Live" [ref=e692] [cursor=pointer]:
                - /url: /docs#streaming
                - text: "#"
            - paragraph [ref=e693]: Approved-account viewing and hosting.
          - paragraph [ref=e694]: Sign in with an approved account to open /stream for discoverable rooms, live Solana observations, agents, and the read-only wallet plugin. Each room has a shareable /stream/:id address. Approved CLAWD accounts can create, host, and watch rooms. An unlisted room is accessible to approved signed-in viewers with its link.
          - list [ref=e695]:
            - listitem [ref=e696]: Sign in with an approved account and create a public or unlisted room.
            - listitem [ref=e697]: Join as host explicitly. Camera and microphone start off; choose devices and enable the media you want to share.
            - listitem [ref=e698]: Use the Cloudflare RealtimeKit stage controls for participants, chat, screen sharing, local video effects, and leaving.
            - listitem [ref=e699]: Share the room link. Approved signed-in viewers receive a restricted role without audio, video, screen publishing, or host privileges.
            - listitem [ref=e700]: Choose End broadcast to disable the meeting and remove participants. Provider uncertainty is displayed for review.
          - paragraph [ref=e701]: A created room is not yet evidence of live media. Live status requires fresh Cloudflare session and host participant receipts. Owner approval is checked before host operations; revoked access closes owned broadcasts. Recording, automatic livestream recording, and transcription are disabled.
          - heading "Text agents and public images" [level=3] [ref=e702]
          - paragraph [ref=e703]: CLAWD Guide and Solana Scout use xAI grok-4.7 with a configured OpenRouter fallback after explicit approved-user submissions. Scout has bounded, read-only research tools. These text agents do not listen to meeting audio. Read aloud uses browser speech when clicked; it is separate from a real AI participant speaking on the stage.
          - paragraph [ref=e704]: Use Stop answer to end an active response or Copy text to reuse it. Each text request answers one question from bounded server context. Limits are one active request per account, four across the web process, and twelve requests per ten minutes; questions may be up to 2,000 characters.
          - paragraph [ref=e705]: Approved users can upload static PNG, JPEG, or WebP avatars and backgrounds, up to 3 MiB and 4,096 pixels per side, into a separate streaming bucket. These are public sharing assets; only their upload owner can delete them. Keep private documents and sensitive images in private account storage.
