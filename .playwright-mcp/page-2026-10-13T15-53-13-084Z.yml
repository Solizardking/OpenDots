        - region [ref=e1774]:
          - generic [ref=e1775]:
            - generic [ref=e1776]: Operate CLAWD Mail
            - heading [level=2] [ref=e1777]:
              - text: Local development and hosting
              - link "Link to Local development and hosting" [ref=e1778] [cursor=pointer]:
                - /url: /docs#self-hosting
                - text: "#"
            - paragraph [ref=e1779]: The web app, receiver, worker, and optional media runtime.
          - paragraph [ref=e1780]: Use Node.js 22.19.0 or newer; .nvmrc and the Dockerfile select Node 24. Install the frontend and backend dependency sets. Copy backend/.env.example into ignored backend/.env.local, then fill the private account, database, Cloudflare, and R2 settings for your installation.
          - generic [ref=e1781]:
            - generic [ref=e1782]:
              - generic [ref=e1783]: Install and start the web application
              - button "Copy Install and start the web application" [ref=e1784] [cursor=pointer]: Copy
            - generic "Install and start the web application" [ref=e1788]:
              - code [ref=e1789]: "npm ci npm ci --prefix backend cp backend/.env.example backend/.env.local # Fill in private configuration before migrating or starting. npm run db:setup npm run build npm run mail:start # Open http://127.0.0.1:4001"
          - paragraph [ref=e1790]: For frontend development, npm run dev starts the web API and Vue together at http://127.0.0.1:8080. npm run serve also starts Vue alone with /api proxied to port 4001, so keep the backend running. Member signup is public. Only a deliberate owner-bootstrap registration uses setupKey matching the private MAIL_ACCESS_KEY; the first public signup stays a member.
          - heading "Receiving and sending email" [level=3] [ref=e1791]
          - paragraph [ref=e1792]: npm run mail:setup verifies the Cloudflare token, creates the private bucket if needed, deploys the Email Worker, creates the default inbox, and enables registered-inbox catch-all delivery on the exact primary domain. Unknown or deleted inboxes are rejected by the receiver. Existing explicit rules retain priority; conflicting active destinations stop setup for review. Verify retained legacy-domain rules separately. Wrangler must be available. Enable Email Routing and Email Sending for the exact mail domain and configure its MX, SPF, DKIM, and DMARC records. Use the dedicated sending token for outgoing mail. The setup command does not deploy the website or start the responder.
          - paragraph [ref=e1793]: The receiver uses Cloudflare’s Email Worker email handler to parse incoming MIME into private R2 objects. It is not a public HTTP webhook for posting email. Its HTTP /health endpoint is a separate receiver check. Registered inbox rules route the chosen domains to that receiver.
          - heading "Continuous responder service" [level=3] [ref=e1794]
          - generic [ref=e1795]:
            - generic [ref=e1796]:
              - generic [ref=e1797]: Run the worker in a second local terminal
              - button "Copy Run the worker in a second local terminal" [ref=e1798] [cursor=pointer]: Copy
            - generic "Run the worker in a second local terminal" [ref=e1802]:
              - code [ref=e1803]: "# Starting an enabled worker can reply to real stored mail, including backlog. PORT=4002 npm run mail:worker"
          - 'region "Local development and hosting: Component, Role and production behavior" [ref=e1804]':
            - table [ref=e1805]:
              - rowgroup [ref=e1806]:
                - row [ref=e1807]:
                  - columnheader "Component" [ref=e1808]
                  - columnheader "Role and production behavior" [ref=e1809]
              - rowgroup [ref=e1810]:
                - row [ref=e1811]:
                  - cell "Web/API" [ref=e1812]
                  - cell "node backend/index.js serves compiled dist and /api together. Health path /api/health." [ref=e1813]
                - row [ref=e1814]:
                  - cell "Email receiver" [ref=e1815]
                  - cell "Cloudflare Email Worker stores incoming MIME, messages, and attachments in private R2." [ref=e1816]
                - row [ref=e1817]:
                  - cell "Continuous worker" [ref=e1818]
                  - cell "node backend/agent-worker.js handles automatic replies, signup welcomes, and scheduled knowledge crawls. Health path /health; at least one replica with sleeping disabled." [ref=e1819]
                - row [ref=e1820]:
                  - cell "Neon and R2" [ref=e1821]
                  - cell "Durable account/job/receipt metadata and private object storage; shared by web and worker. No Railway volume is required." [ref=e1822]
                - row [ref=e1823]:
                  - cell "Voice/vision runtime" [ref=e1824]
                  - cell "Optional separate Python 3.12 service built from vision-agents/Dockerfile, reached through a private URL and shared service token." [ref=e1825]
          - heading "Railway production settings" [level=3] [ref=e1826]
          - paragraph [ref=e1827]: Build the repository-root Dockerfile. Set the pre-deploy command to npm run db:setup and web start command to node backend/index.js. Use PORT=8080, HOST=0.0.0.0, NODE_ENV=production, TRUST_PROXY_HOPS=1, and the exact HTTPS origin for APP_ORIGIN and BETTER_AUTH_URL. Use a 120-second healthcheck timeout and target port 8080. Deploy the continuous worker as a second service from the same image with its own start command and /health check.
          - paragraph [ref=e1828]: Web and worker share the private database, R2, mail-domain, xAI, and launch configuration. Preserve primary and legacy mail domains on the receiver too. Install exactly the hosting provider’s domain records. Verify normal DNS, HTTPS, account signup/approval, private storage, actual mail delivery, and a fresh worker heartbeat separately. Static Vercel/Netlify configuration by itself does not host the API.
          - heading "Validation" [level=3] [ref=e1829]
          - generic [ref=e1830]:
            - generic [ref=e1831]:
              - generic [ref=e1832]: Repository checks
              - button "Copy Repository checks" [ref=e1833] [cursor=pointer]: Copy
            - generic "Repository checks" [ref=e1837]:
              - code [ref=e1838]: "npm run lint -- --no-fix npm run mail:test npm run build node scripts/verify-docs.cjs # Optional fixture UI checks: npm run verify:ui"
          - paragraph [ref=e1839]: Fixture tests exercise authorization and UI behavior without sending real email. They do not prove SMTP delivery, a continuously running hosted responder, funded mainnet execution, or hosted media. Provider verification requires separate controlled requests and inspection of the actual resulting receipt or delivery.
