        - region [ref=e299]:
          - generic [ref=e300]:
            - generic [ref=e301]: Start here
            - heading [level=2] [ref=e302]:
              - text: Accounts, onboarding, and files
              - link "Link to Accounts, onboarding, and files" [ref=e303] [cursor=pointer]:
                - /url: /docs#accounts
                - text: "#"
            - paragraph [ref=e304]: Individual sessions and ownership for every private action.
          - paragraph [ref=e305]: When Neon accounts are configured, sign-in uses your individual email and password through Better Auth. Session cookies are HttpOnly and SameSite=Lax, last eight hours, and use Secure in production. Signing out revokes the server session; changing a password revokes other sessions.
          - 'region "Accounts, onboarding, and files: Account state, Available actions" [ref=e306]':
            - table [ref=e307]:
              - rowgroup [ref=e308]:
                - row [ref=e309]:
                  - columnheader "Account state" [ref=e310]
                  - columnheader "Available actions" [ref=e311]
              - rowgroup [ref=e312]:
                - row [ref=e313]:
                  - cell "First-login onboarding" [ref=e314]
                  - cell "Publish and verify your account-specific X welcome post. Inspect account status, change password, or sign out; private features remain unavailable until verification." [ref=e315]
                - row [ref=e316]:
                  - cell "Approved member" [ref=e317]
                  - cell "After onboarding, use owned inboxes, files, assistant, responder controls, launch requests, and hosting features when their providers are configured." [ref=e318]
                - row [ref=e319]:
                  - cell "Approved owner" [ref=e320]
                  - cell "Member capabilities plus member approval decisions, optional invitations, and manual public-knowledge crawl requests." [ref=e321]
                - row [ref=e322]:
                  - cell "Blocked" [ref=e323]
                  - cell "Private access and worker processing are denied. Existing sessions are checked against the current decision." [ref=e324]
          - paragraph [ref=e325]: Public signup automatically approves members. Existing approved signed-in or inbox-owning users are retained at migration; unused accounts complete first-login onboarding. In Account & files, the owner retains access-management controls. Account access does not grant access to someone else’s messages, files, launch wallet, or room controls. Changes are checked on private requests and before automatic generation and dispatch.
          - heading "Private file storage" [level=3] [ref=e326]
          - paragraph [ref=e327]: Approved users can upload, download, and delete their own files in Account & files. Each upload is limited to 5 MiB. File metadata lives in Neon; bytes live in private R2 under the user’s namespace. These files are separate from mail attachments and public streaming images; uploading a file does not attach it to an email.
          - heading "Invitations and alternate connections" [level=3] [ref=e328]
          - paragraph [ref=e329]: An approved owner can issue a one-use invitation through the API, optionally bound to a login email, valid for seven days. Invitations are optional and do not waive first-login onboarding or prevent public signup. When the individual-account approval policy is active, the independent AgentMail adapter and legacy shared mailbox-key access are disabled. In a legacy installation, first establish a valid CLAWD mailbox session at /login, then open the authenticated /connect page to use the optional AgentMail adapter. An AgentMail key alone does not authorize CLAWD product pages.
          - link "Open Account & files Sign-in, first-login onboarding, and active account access apply." [ref=e331] [cursor=pointer]:
            - /url: /account
            - generic [ref=e332]:
              - strong [ref=e333]: Open Account & files
              - generic [ref=e334]: Sign-in, first-login onboarding, and active account access apply.
        - region [ref=e337]:
          - generic [ref=e338]:
            - generic [ref=e339]: The workspace
            - heading [level=2] [ref=e340]:
              - text: Inboxes and conversations
              - link "Link to Inboxes and conversations" [ref=e341] [cursor=pointer]:
                - /url: /docs#mail
                - text: "#"
            - paragraph [ref=e342]: Compose, reply, organize, and understand delivery.
          - paragraph [ref=e343]: Use the Agent inboxes selector to switch between your owned addresses. New addresses use the installation’s primary mail domain, normally @clawdmail.app. Configured legacy @musebook.trade inboxes keep their existing address and history. Mailbox names are lowercased and accept 1–64 letters, numbers, dots, underscores, or hyphens, beginning with a letter or number.
          - list [ref=e344]:
            - listitem [ref=e345]: Inbox, Starred, Sent, Drafts, and Trash keep mail organized. Search conversations by people, subject, or conversation preview using the mailbox search field. Draft search also covers draft text.
            - listitem [ref=e346]: Compose accepts comma- or semicolon-separated recipients. Save a draft to continue later. Sending a saved draft remains an explicit action.
            - listitem [ref=e347]: Open a conversation to read its messages, download incoming attachments, and reply in the same thread. Replies preserve threading headers.
            - listitem [ref=e348]: Star conversations, move them to Trash, or restore them using the folder controls. The core API updates message labels; it does not offer a permanent-message-delete endpoint.
            - listitem [ref=e349]: Incoming HTML uses sandboxed frames with scripts and external tracking resources blocked. Plain text, original MIME, and incoming attachments remain privately stored.
            - listitem [ref=e350]: The current composer does not offer manual attachment upload. Incoming and generated reply attachments can be downloaded; private account files are a separate feature.
          - 'region "Inboxes and conversations: Delivery result, Meaning and next step" [ref=e351]':
            - table [ref=e352]:
              - rowgroup [ref=e353]:
                - row [ref=e354]:
                  - columnheader "Delivery result" [ref=e355]
                  - columnheader "Meaning and next step" [ref=e356]
              - rowgroup [ref=e357]:
                - row [ref=e358]:
                  - cell "Queued" [ref=e359]
                  - cell "The provider accepted the recipient for delivery. Final receipt is not yet proved." [ref=e360]
                - row [ref=e361]:
                  - cell "Delivered" [ref=e362]
                  - cell "The provider reports delivery for the recipient." [ref=e363]
                - row [ref=e364]:
                  - cell "Bounced / failed" [ref=e365]
                  - cell "The provider rejected delivery or the request failed; inspect the displayed result." [ref=e366]
                - row [ref=e367]:
                  - cell "Uncertain / ambiguous" [ref=e368]
                  - cell "Acceptance cannot be established. Check provider records and the thread before any manual resend." [ref=e369]
                - row [ref=e370]:
                  - cell "Accepted with storage warning" [ref=e371]
                  - cell "The provider accepted mail but saving its private sent copy failed. Do not resend just to recreate a copy." [ref=e372]
          - heading "Mail sounds and signup welcomes" [level=3] [ref=e373]
          - paragraph [ref=e374]: The speaker button or Account & files can preview or mute the incoming “You’ve got mail!” cue and the sent whoosh. Preferences are per account in this browser and synchronize across its tabs. New owned-inbox mail is polled every 15 seconds, or 30 seconds in a background tab; browser throttling can delay this. The first snapshot is silent. A click, tap, or keypress may be needed to unlock audio. Sounds work while the app is open and do not require system-notification permission.
          - paragraph [ref=e375]: With signup welcomes enabled, a separate worker job generates original artwork and sends one welcome email to the login address. It reports preparation, acceptance, delivery, failure, or uncertainty. Signup completes independently of that job, and the welcome does not bypass approval. Signup names and addresses are not sent to the artwork model.
