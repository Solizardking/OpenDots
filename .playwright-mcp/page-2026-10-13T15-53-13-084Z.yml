            - generic [ref=e262]: The workspace
            - heading [level=2] [ref=e263]:
              - text: Mint your email agent
              - link "Link to Mint your email agent" [ref=e264] [cursor=pointer]:
                - /url: /docs#email-agents
                - text: "#"
            - paragraph [ref=e265]: An owned mailbox, a public Metaplex identity, and a reviewed Solana transaction.
          - paragraph [ref=e266]: Open /agents/email after signing in and completing account onboarding. Select an owned CLAWD mailbox, a public name and description, supported capabilities, and a verified account wallet. Your owner wallet receives the Core agent asset; the selected sponsor or owner wallet pays mint costs.
          - list [ref=e267]:
            - listitem [ref=e268]: Save a private agent draft. Review the chosen CLAWD mailbox address and public profile before consenting to publication.
            - listitem [ref=e269]: Publish the approved profile and prepare a mint review. Inspect the simulated cost, maximum cost, owner wallet, fee payer, funding shortfall, and review expiry.
            - listitem [ref=e270]: Approve the exact review. A Privy account wallet signs after your approval; an external wallet prompts for transaction signing and must match the verified owner.
            - listitem [ref=e271]: Refresh the same request and receipt until the backend verifies the Core asset owner and Metaplex Agent Identity. Submitted or uncertain requests remain visible without creating another mint.
          - complementary [ref=e272]:
            - generic [ref=e276]:
              - heading "Public profile and private mail" [level=3] [ref=e277]
              - paragraph [ref=e278]: Only the chosen name, description, capabilities, and CLAWD mailbox address are published. Login email, private persona, message content, attachments, and private files remain outside the public profile. Automatic replies retain their separate inbox processing consent and Resume replies action.
          - complementary [ref=e279]:
            - generic [ref=e283]:
              - heading "Funding and receipts" [level=3] [ref=e284]
              - paragraph [ref=e285]: Sponsorship requires an enabled budget and sufficient onchain balance. The review displays exact SOL amounts from integer lamport strings. The verified receipt links the Core asset, Agent Identity PDA, operational Asset Signer PDA, transaction, and public metadata. Operational wallet funds are displayed separately from mint sponsor funds.
