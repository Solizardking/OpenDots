        - region [ref=e207]:
          - generic [ref=e208]:
            - generic [ref=e209]: The workspace
            - heading [level=2] [ref=e210]:
              - text: One CLAWD, twelve agent roles
              - link "Link to One CLAWD, twelve agent roles" [ref=e211] [cursor=pointer]:
                - /url: /docs#agents
                - text: "#"
            - paragraph [ref=e212]: Choose a job for CLAWD, provide context, and review the result.
          - paragraph [ref=e213]: Open /agents after sign-in and first-login onboarding. Choose Inbox Zero, Invoice Processor, Terminal Assistant, Podcast Booking, Receipt Parser, Sales Signal Router, Sales Agent, Scheduling, Support, Voice to Email, x402 Payment, or Note Taker. Each role adapts the prompts and workflows in the supplied AgentMail examples to CLAWD and the configured server-side AI connections.
          - list [ref=e214]:
            - listitem [ref=e215]: Select a role, use its example task or write your own, and fill in any role-specific details.
            - listitem [ref=e216]: Optionally select an owned inbox and conversation. CLAWD can read bounded context from that inbox. Text tasks work without creating an inbox.
            - listitem [ref=e217]: For invoices and receipts, add PNG, JPEG, or WebP images. The browser optimizes up to four images to a combined 600 KiB input budget. For Voice to Email, use browser dictation where supported or paste a transcript.
            - listitem [ref=e218]: Run CLAWD, review the result, and copy or download it. Recent results persist in your private R2 namespace and can be reopened or used for a follow-up.
            - listitem [ref=e219]: To turn output into mail, review the recipient, subject, and body and save an unsent draft to your owned inbox. Open Drafts in Mailboxes to review and send it.
          - complementary [ref=e220]:
            - generic [ref=e224]:
              - heading "Connections and availability" [level=3] [ref=e225]
              - paragraph [ref=e226]: These are interactive agent roles. Calendar booking, CRM updates, invoice accounting, scheduled digests, code execution, and payment settlement require their respective services; the current workspace provides proposals and reviewed output for these actions. The supplied x402 example defaults to mock payments. Each role displays its integration requirements.
          - complementary [ref=e227]:
            - generic [ref=e231]:
              - heading "Private xAI requests" [level=3] [ref=e232]
              - paragraph [ref=e233]: XAI_API_KEY remains on the backend. Selected task text, role details, inbox context, conversation history, and optimized images are sent to xAI, or through OpenRouter to the configured fallback model if xAI is unavailable. This workspace’s tools only read the selected owned inbox; web search and fetching supplied document URLs are disabled. Missing configuration, rejected access, depleted credits, or provider errors are shown explicitly. Dictation depends on the browser’s speech service.
          - heading "Work together by voice and vision" [level=3] [ref=e234]
          - paragraph [ref=e235]: Every role also offers a private CLAWD voice session with optional camera or selected-screen frames. Custom lobster controls show capture state, microphone/speaker mute, typed questions, explicit view analysis, transcripts, and read-only Solana research receipts. The supplied Vision-Agents framework uses xAI speech and scene analysis, with OpenRouter alternatives for bounded speech turns and requested view analysis. The controls show the actual voice provider and model.
          - list [ref=e236]:
            - listitem [ref=e237]: Starting explicitly shares the chosen media and the task context shown above. Stop before starting with a new role or changed details.
            - listitem [ref=e238]: Sessions last up to ten minutes, with one per account and four across the service. Stop closes capture tracks and the private connection. An unconfirmed server shutdown remains visible for Retry Stop.
            - listitem [ref=e239]: Raw media stays out of saved task history. Export the temporary transcript or explicitly use it in a normal task to retain reviewed output.
            - listitem [ref=e240]: Solana tools only read public mainnet data. Successful and unavailable reads have distinct receipts; voice agents cannot sign, send payments, book calendars, or send mail.
