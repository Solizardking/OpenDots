          - paragraph [ref=e469]: Neon deduplicates source messages and coordinates worker leases; private R2 retains generated results before dispatch. Access is rechecked before reads, generation, and sending. If the network fails after dispatch or a sending lease expires, the worker preserves uncertainty rather than resending. There is no automatic replay control for ambiguous jobs.
