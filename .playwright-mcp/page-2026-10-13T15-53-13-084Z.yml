            - paragraph [ref=e647]: A live conversation, an expressive visualizer, and a stream you control.
          - paragraph [ref=e648]: Open /voice to talk with CLAWD, or /stream/livekit to start a camera and screen stream. Sign in, accept the current terms, and complete account onboarding first. Your microphone and camera stay off until you choose to turn them on.
          - heading "Talk with CLAWD" [level=3] [ref=e649]
          - list [ref=e650]:
            - listitem [ref=e651]: Choose Start conversation. Wait for CLAWD to join before speaking or sending a message.
            - listitem [ref=e652]: Turn on Microphone to speak, or type in Conversation and choose Send message. Your speech captions and typed messages appear together as they arrive.
            - listitem [ref=e653]: Use Mute whenever you want to stop sharing your voice. Camera and Share screen are separate choices; only enable the view you want to share.
            - listitem [ref=e654]: Choose End session when finished. Leaving the page also turns off your devices. If closing the session fails, choose Retry ending.
          - paragraph [ref=e655]: The custom CLAWD visualizer follows the agent’s actual audio. Its expression changes only when the agent publishes an expressive delivery; otherwise it stays Neutral. Thinking and speaking indicators show the agent’s current state. An agent’s live avatar appears when it publishes video.
          - heading "Share a live stream" [level=3] [ref=e656]
          - list [ref=e657]:
            - listitem [ref=e658]: Open Live studio and choose Start stream. Enable your microphone, camera, or Share screen as needed.
            - listitem [ref=e659]: Choose Copy stream link and share it with another approved CLAWD member.
            - listitem [ref=e660]: A viewer signs in, opens the link, and chooses Watch stream. Viewers receive the host’s audio, video, and conversation with their own input devices off.
            - listitem [ref=e661]: Choose End session to stop the broadcast and disconnect its viewers. A viewer can choose Leave stream to leave without ending the broadcast.
          - complementary [ref=e662]:
            - generic [ref=e666]:
              - heading "Sound, availability, and conversation history" [level=3] [ref=e667]
              - paragraph [ref=e668]: If your browser pauses playback, choose Enable sound. Device access and screen or tab audio depend on your browser’s permissions and support. If CLAWD does not join, end the session and check the connection before trying again. The conversation panel holds messages from the current session in your browser; starting a new session clears it.
