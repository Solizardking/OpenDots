              - heading "Public pages and authentication" [level=3] [ref=e139]
              - paragraph [ref=e140]: The root opens the CLAWD Mail landing page. /docs, /privacy, /terms, /service, and /mobile are also public. /login offers open registration and sign-in; /onboarding requires an account session and verifies the first-login X welcome post. Community, mail, account, agent, and live-room features require sign-in, current terms, completed onboarding, and active access. Callback, protocol, and media-delivery resources keep their route-specific checks.
          - complementary [ref=e141]:
