          - paragraph [ref=e787]: "Provider keys, credential-bearing RPC URLs, database credentials, and wallet authorization secrets stay in backend/runtime configuration. Never place them in a VUE_APP_* variable: those values are compiled into browser assets. User-facing status and receipts expose safe state rather than secrets or model reasoning."
          - paragraph [ref=e788]: Incoming email, attachments, websites, and tool results are untrusted task data. They cannot override account approval, expand ownership, authorize wallet spending, choose arbitrary automatic-reply recipients, or reveal credentials. Private authorization remains enforced by the server and worker.
        - region [ref=e789]:
          - generic [ref=e790]:
