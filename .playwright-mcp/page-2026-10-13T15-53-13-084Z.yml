        - region [ref=e719]:
          - generic [ref=e720]:
            - generic [ref=e721]: Live rooms
            - heading [level=2] [ref=e722]:
              - text: Voice and vision companions
              - link "Link to Voice and vision companions" [ref=e723] [cursor=pointer]:
                - /url: /docs#voice-vision
                - text: "#"
            - paragraph [ref=e724]: A disclosed AI participant, enabled by the connected host.
          - paragraph [ref=e725]: CLAWD Voice and CLAWD Vision join the same Cloudflare room as separate AI participants with synthesized speech and an animated lobster avatar. A private Python runtime uses the actual GetStream Vision Agents pipeline pinned to commit 902db86438aab03fb64aa7e6ea3afdcc867a3e80. Native xAI speech uses grok-voice-think-fast-2.0, with OpenRouter openai/gpt-audio-mini as a bounded speech-turn alternative. Explicit view understanding uses grok-4.7 with the configured OpenRouter vision fallback.
          - list [ref=e726]:
            - listitem [ref=e727]: As the approved, currently connected room owner, enable your microphone and choose voice only, camera, or an already shared screen.
            - listitem [ref=e728]: Choose Start CLAWD companion. Existing host tracks are cloned; starting the companion does not request a second capture.
            - listitem [ref=e729]: Speak, type a question, or select Analyze this view. Visual analysis runs on an explicit request or visual question.
            - listitem [ref=e730]: Stop the companion when finished. Changing source, leaving, ending, revoked approval, or closing the bridge also disconnects it. Manual Stop preserves your human microphone and camera.
            - listitem [ref=e731]: If cleanup is unconfirmed, use Retry Stop until the runtime and Cloudflare both acknowledge removal.
          - list [ref=e732]:
            - listitem [ref=e733]: Each account gets one successful AI session per UTC day across private agents and broadcast companions; the server reports their shared concurrent capacity. Stop or disconnect after connection consumes the daily allowance, and the controls show its next reset. Sessions expire after ten minutes, or sixty seconds without incoming media/commands in the runtime. Media-agent starts are limited to six per ten minutes.
            - listitem [ref=e734]: Camera/screen frames are capped at 640 × 480 and two frames per second. The bridge uses PCM16 little-endian mono audio at 24 kHz. Both browser clients allow up to sixty seconds of queued speech; exceeding that limit stops the companion with a visible error. Audio reset and Stop cancel queued playback.
            - listitem [ref=e735]: Audio and frames are not saved. Session transcripts and visual observations are held temporarily; host UI history stays in the current browser session.
            - listitem [ref=e736]: Only the backend holds the vision service token. The runtime has no signing, trading, payment, unrestricted tool, or outbound email capability.
          - link "Voice and vision runtime guide Python setup, private deployment, and the exact bridge protocol." [ref=e738] [cursor=pointer]:
            - /url: /docs/VISION-AGENTS.DtxMUo-t.md
            - generic [ref=e739]:
              - strong [ref=e740]: Voice and vision runtime guide
              - generic [ref=e741]: Python setup, private deployment, and the exact bridge protocol.
