            - paragraph [ref=e488]: Shared public sources, with dates and links you can inspect.
          - paragraph [ref=e489]: Account & files → Hookedpad knowledge searches public snapshots of https://www.hookedpad.com/launches and linked token pages. The email agent can retrieve the same corpus using search_hookedpad_launches. Results include source links and crawl dates so you can inspect their freshness.
          - paragraph [ref=e490]: "The application runs its own bounded crawler and uses Supermemory for ingestion and retrieval. It is not personal inbox memory: mail, files, credentials, and user profiles are not ingested into this shared public namespace."
          - list [ref=e491]:
            - listitem [ref=e492]: By default, the continuous worker checks for due crawls every minute and refreshes every six hours. Each run samples the listing plus up to 24 linked detail pages.
            - listitem [ref=e493]: The crawler honors robots.txt, allows only the exact HTTPS Hookedpad origin and listing/token paths, rejects redirects, and runs no page scripts.
            - listitem [ref=e494]: A database lease prevents overlapping crawls. R2 stores status and content hashes, and unchanged pages are not reindexed.
            - listitem [ref=e495]: Supermemory indexing is asynchronous; submitted and indexed page counts are separate. Quota, authentication, robots, and indexing failures remain visible.
            - listitem [ref=e496]: Approved members can search. The approved installation owner can choose Crawl now; it queues work rather than proving immediate completion.
            - listitem [ref=e497]: Prices, rules, and launch statuses are dated website observations. Use live chain research for current on-chain facts.
