                  - cell "Server-managed Privy wallet; exact owner-approved transaction before signing. Server authorization credentials stay private." [ref=e780]
                - row [ref=e781]:
                  - cell "Live media companion" [ref=e782]
                  - cell "Explicit host-selected media is forwarded to the private runtime and xAI, or the configured OpenRouter speech/view alternatives. Raw media stays out of saved task history." [ref=e783]
