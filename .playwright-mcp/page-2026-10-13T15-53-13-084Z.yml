                  - cell "Complete first-login onboarding" [ref=e1950]
                  - cell "Publish the exact prepared welcome post including its account marker and verify the public URL at /onboarding. Re-signing in or opening the composer alone does not unlock private use." [ref=e1951]
                - row [ref=e1952]:
                  - cell "Awaiting approval / access blocked" [ref=e1953]
                  - cell "The installation owner must approve or restore access. Re-signing in does not bypass the current membership decision." [ref=e1954]
                - row [ref=e1955]:
                  - cell "No inbox after signup" [ref=e1956]
                  - cell "Registration, first-login welcome verification, and inbox creation are separate. After onboarding, choose Create an inbox." [ref=e1957]
                - row [ref=e1958]:
                  - cell "Mailbox setup required / pending routing" [ref=e1959]
                  - cell "Inspect Connection settings, exact mail-domain routing/sending enablement, literal Worker rule, DNS records, and receiver/R2 access. Drafts can be saved meanwhile." [ref=e1960]
                - row [ref=e1961]:
                  - cell "Session expired" [ref=e1962]
                  - cell "Sign in again. Moving to a different hostname requires a new cookie session." [ref=e1963]
                - row [ref=e1964]:
                  - cell "Ask Claude unavailable" [ref=e1965]
                  - cell "Check the server OpenRouter key, exact configured model, provider credits/entitlement, and the per-user request limit." [ref=e1966]
                - row [ref=e1967]:
                  - cell "Automatic agent offline" [ref=e1968]
                  - cell "Verify the separate continuous worker is running with fresh heartbeat, the same Neon/R2/domain configuration, configured AI provider access, account approval, and an explicitly consented enabled owned inbox." [ref=e1969]
                - row [ref=e1970]:
                  - cell "Reply failed / ambiguous" [ref=e1971]
                  - cell "Inspect the job’s safe error and Cloudflare delivery record. Ambiguous sends must not be reset or replayed just because a worker restarted." [ref=e1972]
                - row [ref=e1973]:
                  - cell "Hookedpad search stale / unavailable" [ref=e1974]
                  - cell "Inspect last crawl time, indexed/processing/failed counts, namespace consistency, robots policy, worker availability, and Supermemory credits. An owner refresh queues work." [ref=e1975]
                - row [ref=e1976]:
                  - cell "Transaction review expired" [ref=e1977]
                  - cell "Create a fresh review and explicitly approve it. Do not reuse an expired reviewHash." [ref=e1978]
                - row [ref=e1979]:
                  - cell "Launch/claim remains submitted" [ref=e1980]
                  - cell "Refresh the saved signature and inspect its chain receipt. Do not broadcast another transaction to resolve uncertainty." [ref=e1981]
                - row [ref=e1982]:
                  - cell "Room created but not live" [ref=e1983]
                  - cell "Join the host stage and inspect current Cloudflare session/participant status. Creation alone does not prove media." [ref=e1984]
                - row [ref=e1985]:
                  - cell "Companion unavailable / Retry Stop" [ref=e1986]
                  - cell "Check the private vision runtime, configured voice/vision provider access, connected-host approval, selected tracks, capacity, and both runtime/Cloudflare cleanup receipts." [ref=e1987]
                - row [ref=e1988]:
                  - cell "No sound" [ref=e1989]
                  - cell "Click, tap, or press a key to unlock audio; check account mute setting and browser audio. The first snapshot and failed sends are silent. A closed app cannot play the cues." [ref=e1990]
                - row [ref=e1991]:
                  - cell "Provider quota / access error" [ref=e1992]
                  - cell "Restore the relevant provider’s access or credits. The app preserves unavailable states rather than generating a substitute receipt." [ref=e1993]
