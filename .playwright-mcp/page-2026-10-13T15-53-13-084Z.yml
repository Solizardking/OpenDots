            - paragraph [ref=e394]: Reviewed drafting and summaries, with sending under your control.
          - paragraph [ref=e395]: Ask Claude uses the configured anthropic/claude-haiku-5.5 model through OpenRouter. Use it in Compose for a draft, in a conversation for a reply, or in the reader for a summary. Text streams into a review panel.
          - list [ref=e396]:
            - listitem [ref=e397]: Choose draft, reply, or summary and enter instructions.
            - listitem [ref=e398]: Select Request. Only then is the chosen draft or owned conversation sent to the provider.
            - listitem [ref=e399]: Wait for completion and review the result. Apply draft or Apply reply replaces the editor body; a summary remains in its panel.
            - listitem [ref=e400]: Edit as needed and choose Send separately.
          - list [ref=e401]:
            - listitem [ref=e402]: Conversation content is loaded from private storage after ownership checks. Attachments are not shared with the assistant.
            - listitem [ref=e403]: Context uses up to the latest 100 messages and 250,000 body characters; shortened context is identified in the review panel.
            - listitem [ref=e404]: Each user can have four concurrent requests and submit 20 per hour. Output is bounded to 1,000 tokens.
            - listitem [ref=e405]: Jobs and results are private in R2. Reopening a job or polling its status does not submit another provider request.
            - listitem [ref=e406]: Closing the panel or disconnecting the stream does not cancel generation. Cancellation is not available; a lost 90-second execution lease becomes an explicit interrupted result.
            - listitem [ref=e407]: Provider failures are shown. No automatic model substitution or retry is performed. The assistant has no mail-sending or wallet tools.
