            - paragraph [ref=e794]: Same-origin sessions, private resources, and preparation-only MCP.
          - paragraph [ref=e795]: The normal web API uses relative /api paths and the account session cookie. Sign-in, current terms, completed first-login onboarding, and active access are required for private mail and files. Accounts awaiting onboarding can retrieve their status, verify their welcome post, change a password, and sign out. Resource ownership is checked in addition to approval. Owner in this reference means the installation administrator; inbox/room/asset owner means the account that owns that resource.
          - complementary [ref=e796]:
            - generic [ref=e800]:
              - heading "No general account API token" [level=3] [ref=e801]
              - paragraph [ref=e802]: "When accounts are configured, Authorization: Bearer MAIL_ACCESS_KEY and the legacy mailbox cookie cannot access private mail APIs. POST /api/mail/login returns 410. Without database accounts, the earlier shared-key/local mailbox session remains available. The launch MCP has a separate inbox-scoped bearer key and only prepare/read tools."
          - paragraph [ref=e803]: Use the exact allowed app Origin for state-changing browser requests. Cookie sessions need a same-site deployment; configure the backend origin at build time only if hosting the frontend separately. URL-encode inbox addresses and IDs in path segments. The examples below use placeholders and are intended for an approved account’s same-origin browser session.
          - generic [ref=e804]:
            - generic [ref=e805]:
              - generic [ref=e806]: List your owned inboxes
              - button "Copy List your owned inboxes" [ref=e807] [cursor=pointer]: Copy
            - generic "List your owned inboxes" [ref=e811]:
              - code [ref=e812]: "const response = await fetch('/api/mail/inboxes', { credentials: 'include' }) const data = await response.json() if (!response.ok) throw new Error(data.error) console.log(data.inboxes)"
          - generic [ref=e813]:
            - generic [ref=e814]:
              - generic [ref=e815]: Send a message explicitly
              - button "Copy Send a message explicitly" [ref=e816] [cursor=pointer]: Copy
            - generic "Send a message explicitly" [ref=e820]:
              - code [ref=e821]: "const inbox = encodeURIComponent('your-agent@clawdmail.app') const response = await fetch(`/api/mail/inboxes/${inbox}/messages`, { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to: ['recipient@example.com'], subject: 'Hello from my agent', text: 'Here are the notes you requested.' }) }) const result = await response.json() if (!response.ok) throw new Error(result.error) // Inspect result.delivery. Queued is provider acceptance, not delivery proof."
          - generic [ref=e822]:
            - generic [ref=e823]:
              - generic [ref=e824]: Create and inspect an assistant job
              - button "Copy Create and inspect an assistant job" [ref=e825] [cursor=pointer]: Copy
            - generic "Create and inspect an assistant job" [ref=e829]:
              - code [ref=e830]: "const response = await fetch('/api/mail/assistant/jobs', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'draft', instructions: 'Write a concise meeting follow-up.', subject: 'Next steps', text: 'We agreed to share notes on Friday.' }) }) const job = await response.json() if (!response.ok) throw new Error(job.error) // JSON returns 202; poll this URL without starting another generation. const status = await fetch(`/api/mail/assistant/jobs/${encodeURIComponent(job.id)}`, { credentials: 'include' }) const current = await status.json() // When current.status === 'ready', review current.result.text. Sending is separate."
          - paragraph [ref=e831]: "Assistant POST requests with Accept: text/event-stream stream named job events; JSON requests return HTTP 202 and can be polled. Public activity streams use named activity events. Stream-agent chat streams its own event protocol. A stream disconnect does not automatically retry a paid assistant request."
