            - paragraph [ref=e172]: From signup to a working inbox.
          - list [ref=e173]:
            - listitem [ref=e174]: Start at clawdmail.app, open /login, and choose Create account. Enter your name, login email, a password of 12–128 characters, current terms acceptance, and adult affirmation. No invitation or setup key is needed for a member.
            - listitem [ref=e175]: "On your first sign-in, complete /onboarding: publish the prepared X welcome message with your unique account marker, paste the public post URL, and verify it. Mail and agent features unlock only after server verification succeeds."
            - listitem [ref=e176]: After onboarding, open your mailbox and choose Create an inbox. Choose an address name and display name. Signup itself does not create an inbox.
            - listitem [ref=e177]: Check Connection settings for receiving and sending readiness. If domain routing is pending, drafts remain useful while an administrator completes setup.
            - listitem [ref=e178]: "Choose Compose, enter a recipient, subject, and message, then Send. Review the delivery result: queued, delivered, bounced, or unavailable."
            - listitem [ref=e179]: Open Account & files → Your CLAWD agent to review or pause automatic replies before sending mail to your enabled inbox. New approved inboxes are enabled by default when the responder is configured.
          - complementary [ref=e180]:
            - generic [ref=e184]:
              - heading "Required X welcome post" [level=3] [ref=e185]
              - paragraph [ref=e186]: "eureka I've got mail! i just registered for clawdmail powered by $CLAWD on @solana, follow @clawddevs and me as we onboard the world to solana ai one email at a time! The composer appends your unique #ClawdMail<code> marker. Publish it yourself, then verify the public link; the app stores no X password or token."
